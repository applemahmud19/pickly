<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#AA2C2D">
<title>ইন্টারনেট নেই — বুক গ্যালাক্সি</title>
<style>
  :root{--red:#AA2C2D;--bg:#fff;--fg:#222;--muted:#666}
  @media (prefers-color-scheme:dark){:root{--bg:#0d121b;--fg:#f1f1f1;--muted:#a0a8b5}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--fg);font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,-apple-system,sans-serif;text-align:center}
  .card{max-width:360px}
  .ic{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:2.4rem}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{margin:0 0 20px;line-height:1.7;color:var(--muted);font-size:.95rem}
  button{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:1rem;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">📚</div>
    <h1>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
    <p>চিন্তা নেই! সংযোগ ফিরে এলেই আপনার প্রিয় বইগুলো আবার পাবেন। একটু পরে আবার চেষ্টা করুন।</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
  </div>
  <script>addEventListener('online',()=>location.reload())</script>
</body>
</html>
